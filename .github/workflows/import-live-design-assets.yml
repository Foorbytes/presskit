name: Import live Foorbytes design assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download local copies of live-site assets
        run: |
          set -euo pipefail
          mkdir -p assets/images/store

          curl -L --fail --retry 3 \
            'https://images.squarespace-cdn.com/content/v1/663fce461ced224cfc020096/d9c0e13e-ee84-4625-8be3-326f9d511675/foorbytes-site-logo-horizontal-2024.png?format=1500w' \
            -o assets/images/foorbytes-logo-horizontal.png

          curl -L --fail --retry 3 \
            'https://images.squarespace-cdn.com/content/v1/663fce461ced224cfc020096/e8e2905d-86b7-47d2-ad58-27ee57a67fbc/Screenshot+2024-07-19+at+10.34.23%E2%80%AFAM.png?format=2500w' \
            -o assets/images/home-hero.png

          curl -L --fail --retry 3 \
            'https://images.squarespace-cdn.com/content/v1/663fce461ced224cfc020096/6141cf6e-4607-460c-aea0-74475245cb33/Steam_Button.png.webp?format=750w' \
            -o assets/images/store/steam-button.webp

          curl -L --fail --retry 3 \
            'https://images.squarespace-cdn.com/content/v1/663fce461ced224cfc020096/90eb3a46-6060-4858-a777-4393fdf948a6/appstore.png?format=750w' \
            -o assets/images/store/app-store-badge.png

          cp assets/images/store/steam-banner.png assets/images/bad-credit-hero.png

      - name: Commit assets and remove workflow
        run: |
          rm -f .github/workflows/import-live-design-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import live Foorbytes design assets [skip ci]"
          git push
