name: Finish and test Foorbytes redesign

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finish-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Standardize article navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          article_files = [
              "million-downloads.html",
              "steam-launch.html",
              "steam-announcement.html",
              "fright-night-files.html",
              "100k-downloads.html",
              "game-jam-to-release.html",
              "google-play-preregistration.html",
              "app-store-preorder.html",
              "welcome-to-foorbytes.html",
          ]

          standard_header = '''<header class="site-header" data-site-header>
        <a class="brand" href="index.html" aria-label="Foorbytes home">
            <img src="assets/images/foorbytes-logo-horizontal.png" alt="Foorbytes">
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" data-menu-toggle>
            <span></span><span></span><span></span>
            <span class="sr-only">Open menu</span>
        </button>
        <nav class="site-nav" id="site-navigation" aria-label="Main navigation" data-site-nav>
            <a href="index.html">Home</a>
            <a href="badcredit.html">Bad Credit? No Problem!</a>
            <a class="is-current" href="news.html">News &amp; Events</a>
            <a href="https://discord.gg/vkA5VkzYuy" target="_blank" rel="noopener noreferrer">Join Our Discord!</a>
        </nav>
    </header>'''

          header_pattern = re.compile(r'<header class="site-header"[^>]*>.*?</header>', re.S)

          for filename in article_files:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text, replacements = header_pattern.subn(standard_header, text, count=1)
              if replacements != 1:
                  raise RuntimeError(f"Unable to standardize header in {filename}")
              if '<script src="site.js"></script>' not in text:
                  text = text.replace('</body>', '    <script src="site.js"></script>\n</body>')
              path.write_text(text, encoding="utf-8")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser validation tools
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Validate desktop and mobile pages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 > /tmp/foorbytes-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          cat > validate.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const pages = [
            'index.html',
            'badcredit.html',
            'news.html',
            'million-downloads.html',
            'steam-launch.html',
            'steam-announcement.html',
            'fright-night-files.html',
            '100k-downloads.html',
            'game-jam-to-release.html',
            'google-play-preregistration.html',
            'app-store-preorder.html',
            'welcome-to-foorbytes.html'
          ];

          const viewports = {
            desktop: { width: 1440, height: 900 },
            mobile: { width: 390, height: 844 }
          };

          const browser = await chromium.launch({ headless: true });
          const report = {
            generatedAt: new Date().toISOString(),
            summary: { passed: true, pages: pages.length, checks: 0, failures: 0 },
            results: []
          };

          for (const [mode, viewport] of Object.entries(viewports)) {
            for (const path of pages) {
              const page = await browser.newPage({ viewport });
              const errors = [];
              const consoleErrors = [];
              page.on('pageerror', error => errors.push(String(error)));
              page.on('console', message => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });

              const url = `http://127.0.0.1:8000/${path}`;
              const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });

              const checks = await page.evaluate(() => {
                const images = [...document.images].map(img => ({
                  src: img.getAttribute('src') || '',
                  complete: img.complete,
                  naturalWidth: img.naturalWidth,
                  naturalHeight: img.naturalHeight
                }));

                const localLinks = [...document.querySelectorAll('a[href]')]
                  .map(a => a.getAttribute('href'))
                  .filter(Boolean)
                  .filter(href => !href.startsWith('#') && !href.startsWith('mailto:') && !href.startsWith('tel:') && !/^https?:\/\//i.test(href));

                const toggle = document.querySelector('[data-menu-toggle]');
                const nav = document.querySelector('[data-site-nav]');

                return {
                  title: document.title,
                  h1Count: document.querySelectorAll('h1').length,
                  imageFailures: images.filter(img => !img.complete || img.naturalWidth === 0),
                  localLinks: [...new Set(localLinks)],
                  horizontalOverflow: document.documentElement.scrollWidth - window.innerWidth,
                  hasMenuToggle: Boolean(toggle),
                  hasNavigation: Boolean(nav),
                  bodyHeight: document.body.scrollHeight
                };
              });

              const linkFailures = [];
              for (const href of checks.localLinks) {
                const target = new URL(href, url).href;
                const linkResponse = await page.request.get(target);
                if (!linkResponse.ok()) {
                  linkFailures.push({ href, status: linkResponse.status() });
                }
              }

              let mobileMenu = null;
              if (mode === 'mobile' && checks.hasMenuToggle && checks.hasNavigation) {
                await page.locator('[data-menu-toggle]').click();
                mobileMenu = await page.evaluate(() => {
                  const toggle = document.querySelector('[data-menu-toggle]');
                  const nav = document.querySelector('[data-site-nav]');
                  const style = nav ? getComputedStyle(nav) : null;
                  return {
                    expanded: toggle?.getAttribute('aria-expanded') === 'true',
                    openClass: nav?.classList.contains('is-open') || false,
                    opacity: style?.opacity || '',
                    pointerEvents: style?.pointerEvents || ''
                  };
                });
              }

              const failures = [];
              if (!response || !response.ok()) failures.push(`Page returned ${response?.status() ?? 'no response'}`);
              if (!checks.title) failures.push('Missing document title');
              if (checks.h1Count !== 1) failures.push(`Expected one h1, found ${checks.h1Count}`);
              if (checks.imageFailures.length) failures.push(`${checks.imageFailures.length} broken images`);
              if (linkFailures.length) failures.push(`${linkFailures.length} broken local links`);
              if (checks.horizontalOverflow > 2) failures.push(`Horizontal overflow of ${checks.horizontalOverflow}px`);
              if (errors.length) failures.push(`${errors.length} JavaScript page errors`);
              if (consoleErrors.length) failures.push(`${consoleErrors.length} console errors`);
              if (mode === 'mobile' && (!mobileMenu?.expanded || !mobileMenu?.openClass || mobileMenu?.pointerEvents === 'none')) {
                failures.push('Mobile menu did not open correctly');
              }

              report.summary.checks += 1;
              report.summary.failures += failures.length;
              if (failures.length) report.summary.passed = false;
              report.results.push({
                page: path,
                mode,
                viewport,
                failures,
                checks,
                linkFailures,
                errors,
                consoleErrors,
                mobileMenu
              });

              await page.close();
            }
          }

          await browser.close();
          fs.writeFileSync('redesign-validation-report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report.summary));
          EOF

          node validate.mjs

      - name: Commit completed redesign and report
        run: |
          rm -rf node_modules package.json package-lock.json validate.mjs
          rm -f .github/workflows/finish-and-test-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish and validate Squarespace-inspired redesign [skip ci]"
          git push
