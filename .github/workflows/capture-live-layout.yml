name: Capture live Foorbytes layout

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Inspect live Squarespace site
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const targets = [
            ['home', 'https://www.foorbytes.com/'],
            ['game', 'https://www.foorbytes.com/badcreditnoproblem'],
            ['blog', 'https://www.foorbytes.com/foorbytes-dev-blog']
          ];
          const browser = await chromium.launch({ headless: true });
          const output = {};

          for (const [name, url] of targets) {
            output[name] = {};
            for (const [mode, viewport] of Object.entries({
              desktop: { width: 1440, height: 1000 },
              mobile: { width: 390, height: 844 }
            })) {
              const page = await browser.newPage({ viewport });
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(5000);

              output[name][mode] = await page.evaluate(() => {
                const styleOf = (el) => {
                  const cs = getComputedStyle(el);
                  const r = el.getBoundingClientRect();
                  return {
                    tag: el.tagName.toLowerCase(),
                    id: el.id || '',
                    classes: typeof el.className === 'string' ? el.className.slice(0, 220) : '',
                    text: (el.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 180),
                    rect: [Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height)],
                    font: [cs.fontFamily, cs.fontSize, cs.fontWeight, cs.lineHeight, cs.letterSpacing],
                    colors: [cs.color, cs.backgroundColor, cs.backgroundImage],
                    layout: [cs.display, cs.position, cs.textAlign, cs.padding, cs.margin, cs.gap, cs.maxWidth],
                    border: [cs.borderRadius, cs.borderColor, cs.borderWidth],
                    image: el.tagName === 'IMG' ? [el.currentSrc || el.src, el.naturalWidth, el.naturalHeight, cs.objectFit] : null,
                    href: el.tagName === 'A' ? el.href : null
                  };
                };

                const candidates = [...document.querySelectorAll('header, nav, main, section, footer, h1, h2, h3, p, a, button, img')]
                  .filter((el) => {
                    const r = el.getBoundingClientRect();
                    const cs = getComputedStyle(el);
                    return r.width > 20 && r.height > 8 && cs.display !== 'none' && cs.visibility !== 'hidden';
                  })
                  .slice(0, 220)
                  .map(styleOf);

                const body = getComputedStyle(document.body);
                return {
                  title: document.title,
                  viewport: [innerWidth, innerHeight],
                  document: [document.documentElement.scrollWidth, document.documentElement.scrollHeight],
                  body: {
                    fontFamily: body.fontFamily,
                    fontSize: body.fontSize,
                    color: body.color,
                    backgroundColor: body.backgroundColor,
                    backgroundImage: body.backgroundImage
                  },
                  elements: candidates
                };
              });
              await page.close();
            }
          }

          await browser.close();
          fs.writeFileSync('live-layout-reference.json', JSON.stringify(output, null, 2));
          EOF
          node capture.mjs

      - name: Save inspection and remove workflow
        run: |
          rm -f .github/workflows/capture-live-layout.yml capture.mjs package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture live Squarespace layout [skip ci]"
          git push
