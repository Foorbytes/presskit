name: Capture live Foorbytes design reference

on:
  push:
    branches:
      - agent/capture-foorbytes-reference-2

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-foorbytes-reference-2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture visual and DOM references
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const pages = [
            ['home', 'https://www.foorbytes.com/'],
            ['game', 'https://www.foorbytes.com/badcreditnoproblem'],
            ['blog', 'https://www.foorbytes.com/foorbytes-dev-blog']
          ];
          const viewports = [
            ['desktop', { width: 1440, height: 1000 }],
            ['mobile', { width: 390, height: 844 }]
          ];

          fs.mkdirSync('reference/live-site', { recursive: true });
          const browser = await chromium.launch({ headless: true });

          for (const [pageName, url] of pages) {
            for (const [viewportName, viewport] of viewports) {
              const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(5000);

              const jpg = await page.screenshot({ type: 'jpeg', quality: 48, fullPage: false });
              const b64 = jpg.toString('base64').match(/.{1,1600}/g)?.join('\n') ?? '';
              fs.writeFileSync(`reference/live-site/${pageName}-${viewportName}.jpg.b64.txt`, b64);

              const report = await page.evaluate(({ pageName, viewportName, url }) => {
                const elementReport = (el) => {
                  const rect = el.getBoundingClientRect();
                  const cs = getComputedStyle(el);
                  const text = (el.innerText || el.getAttribute('aria-label') || '').replace(/\s+/g, ' ').trim().slice(0, 220);
                  return {
                    tag: el.tagName.toLowerCase(),
                    id: el.id || '',
                    className: typeof el.className === 'string' ? el.className.slice(0, 260) : '',
                    text,
                    rect: {
                      x: Math.round(rect.x), y: Math.round(rect.y),
                      width: Math.round(rect.width), height: Math.round(rect.height)
                    },
                    style: {
                      display: cs.display,
                      position: cs.position,
                      fontFamily: cs.fontFamily,
                      fontSize: cs.fontSize,
                      fontWeight: cs.fontWeight,
                      lineHeight: cs.lineHeight,
                      letterSpacing: cs.letterSpacing,
                      color: cs.color,
                      backgroundColor: cs.backgroundColor,
                      backgroundImage: cs.backgroundImage,
                      textAlign: cs.textAlign,
                      textTransform: cs.textTransform,
                      borderRadius: cs.borderRadius,
                      borderColor: cs.borderColor,
                      padding: cs.padding,
                      margin: cs.margin,
                      gap: cs.gap,
                      maxWidth: cs.maxWidth
                    },
                    image: el.tagName === 'IMG' ? {
                      src: el.currentSrc || el.src,
                      naturalWidth: el.naturalWidth,
                      naturalHeight: el.naturalHeight,
                      objectFit: cs.objectFit
                    } : null,
                    href: el.tagName === 'A' ? el.href : null
                  };
                };

                const elements = [...document.querySelectorAll('header, nav, main, section, footer, h1, h2, h3, p, a, button, img')]
                  .filter((el) => {
                    const r = el.getBoundingClientRect();
                    const cs = getComputedStyle(el);
                    return r.width > 20 && r.height > 8 && cs.display !== 'none' && cs.visibility !== 'hidden';
                  })
                  .slice(0, 260)
                  .map(elementReport);

                const body = getComputedStyle(document.body);
                const html = getComputedStyle(document.documentElement);
                return {
                  pageName,
                  viewportName,
                  url,
                  title: document.title,
                  viewport: { width: innerWidth, height: innerHeight },
                  document: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight },
                  body: {
                    fontFamily: body.fontFamily,
                    fontSize: body.fontSize,
                    color: body.color,
                    backgroundColor: body.backgroundColor,
                    backgroundImage: body.backgroundImage,
                    margin: body.margin
                  },
                  html: {
                    backgroundColor: html.backgroundColor,
                    fontSize: html.fontSize
                  },
                  elements
                };
              }, { pageName, viewportName, url });

              fs.writeFileSync(`reference/live-site/${pageName}-${viewportName}.json`, JSON.stringify(report, null, 2));
              await page.close();
            }
          }

          await browser.close();
          EOF
          node capture.mjs

      - name: Commit reference files
        run: |
          rm -f .github/workflows/capture-live-reference.yml capture.mjs package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture live Foorbytes design reference [skip ci]"
          git push origin agent/capture-foorbytes-reference-2
